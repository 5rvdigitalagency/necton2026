
name: Deploy staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: true

jobs:
  checks:
    name: Validate before deployment
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy preview and alias staging
    needs: checks
    runs-on: ubuntu-latest

    environment:
      name: staging

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@50.10.1

      - name: Verify Vercel authentication
        run: |
          set -euo pipefail
          vercel whoami --token "$VERCEL_TOKEN"

      - name: Pull Vercel preview configuration
        run: |
          set -euo pipefail

          vercel pull --yes \
            --environment=preview \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID"

      - name: Deploy to Vercel
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          output="$(
            vercel deploy --yes \
              --token "$VERCEL_TOKEN" \
              --scope "$VERCEL_ORG_ID" 2>&1
          )"

          printf '%s\n' "$output"

          preview_url="$(
            printf '%s\n' "$output" |
            grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app/?' |
            head -n 1 || true
          )"

          if [[ -z "$preview_url" ]]; then
            echo "Could not determine the Vercel deployment URL." >&2
            exit 1
          fi

          preview_url="${preview_url%/}"

          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

          {
            echo "## Staging deployment successful"
            echo ""
            echo "**Preview deployment:**"
            echo "$preview_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Point permanent staging URL at preview
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail

          vercel alias "$PREVIEW_URL" \
            netcon-ivory.vercel.app \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID"
