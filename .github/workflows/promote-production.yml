
name: Promote production

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Exact Vercel preview URL already reviewed on staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote reviewed staging deployment
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://network-consultancy.com

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

    steps:
      - name: Validate deployment URL
        shell: bash
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          set -euo pipefail

          PREVIEW_URL="${PREVIEW_URL%/}"

          if [[ ! "$PREVIEW_URL" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]]; then
            echo "Provide the exact Vercel preview URL, not a production domain." >&2
            exit 1
          fi

          echo "Preview URL validation successful: $PREVIEW_URL"

      - name: Install Vercel CLI
        run: npm install --global vercel@50.10.1

      - name: Verify Vercel authentication
        run: |
          set -euo pipefail
          vercel whoami --token "$VERCEL_TOKEN"

      - name: Promote exact reviewed deployment
        shell: bash
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          set -euo pipefail

          PREVIEW_URL="${PREVIEW_URL%/}"

          vercel promote "$PREVIEW_URL" \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_SCOPE"